# fly.toml app configuration file generated for cli-rts on 2026-07-01T16:22:41-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cli-rts'
primary_region = 'sjc'

# Rooms live in process memory — the app must run on exactly ONE machine.
# Deploy with `fly deploy --ha=false`; if a second machine appears, run
# `fly scale count 1`.

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
